@if (confirmService.state().visible) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
    style="background: rgba(0,0,0,0.45); backdrop-filter: blur(2px);"
    (click)="confirmService.cancelar()">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden"
      (click)="$event.stopPropagation()">

      <!-- Icono + Título -->
      <div class="px-6 pt-6 pb-4 flex items-start gap-4">
        <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center"
          [class]="confirmService.state().tipo === 'danger'  ? 'bg-red-100'    :
                   confirmService.state().tipo === 'warning' ? 'bg-amber-100'  : 'bg-blue-100'">
          @if (confirmService.state().tipo === 'danger') {
            <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          } @else if (confirmService.state().tipo === 'warning') {
            <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          } @else {
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-sm font-semibold text-gray-900">{{ confirmService.state().titulo }}</h3>
          <p class="text-xs text-gray-500 mt-1 leading-relaxed">{{ confirmService.state().mensaje }}</p>
        </div>
      </div>

      <!-- Botones -->
      <div class="px-6 pb-5 flex justify-end gap-2">
        <button type="button" (click)="confirmService.cancelar()"
          class="px-4 py-2 text-xs font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors">
          {{ confirmService.state().labelCancelar }}
        </button>
        <button type="button" (click)="confirmService.aceptar()"
          class="px-4 py-2 text-xs font-semibold text-white rounded-xl transition-colors"
          [class]="confirmService.state().tipo === 'danger'  ? 'bg-red-600 hover:bg-red-700'     :
                   confirmService.state().tipo === 'warning' ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'">
          {{ confirmService.state().labelAceptar }}
        </button>
      </div>
    </div>

  </div>
}
